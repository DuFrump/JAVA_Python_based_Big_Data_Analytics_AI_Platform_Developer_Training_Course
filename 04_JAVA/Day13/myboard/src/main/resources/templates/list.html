<!DOCTYPE html>
<!--
  xmlns:th="http://www.thymeleaf.org"
  이 코드는 이 HTML 파일에서 Thymeleaf 템플릿 엔진의 문법을 사용하겠다고 선언하는 것입니다.
  'th:' 라는 접두사로 시작하는 모든 속성(attribute)은 Thymeleaf에 의해 처리됩니다.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Article List</title>
</head>
<body>
    <h1>Articles</h1>
    <!-- '새 글 작성' 버튼입니다. 클릭하면 자바스크립트의 location.href를 통해 '/articles/new' URL로 이동합니다. -->
    <button onclick="location.href='/articles/new'">New Article</button>
    <ul>
        <!--
          th:each="article : ${articles}"
          Thymeleaf의 반복문입니다. 컨트롤러에서 모델(Model)에 담아 보낸 'articles'라는 이름의 리스트를 순회합니다.
          리스트의 각 아이템은 순회하는 동안 'article'이라는 변수 이름으로 접근할 수 있습니다.
          이 <li> 태그는 'articles' 리스트의 아이템 개수만큼 반복해서 생성됩니다.
        -->
        <li th:each="article : ${articles}">
            <!--
              <a> 태그는 하이퍼링크를 만듭니다.

              th:href="@{/articles/{id}(id=${article.id})}"
              <a> 태그의 href 속성을 동적으로 생성합니다.
              @{...} 문법은 URL을 생성할 때 사용합니다.
              /articles/{id} 형태의 URL을 만드는데, {id} 부분은 (id=${article.id})에 의해 채워집니다.
              만약 현재 순회 중인 article의 id가 1이라면, 최종적으로 생성되는 URL은 '/articles/1'이 됩니다.

              th:text="${article.title}"
              <a> 태그의 텍스트 내용을 동적으로 설정합니다.
              ${article.title}은 현재 순회 중인 article 객체의 title 프로퍼티(getTitle() 메소드 호출) 값을 가져옵니다.
              만약 article의 제목이 "첫 번째 글"이라면, 이 링크의 텍스트는 "첫 번째 글"이 됩니다.
            -->
            <a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}"></a>
        </li>
    </ul>
</body>
</html>
