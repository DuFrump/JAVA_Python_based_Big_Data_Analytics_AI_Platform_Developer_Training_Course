<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Article</title>
</head>
<body>
    <!--
      th:text="${article.title}"
      컨트롤러에서 모델(Model)에 담아 보낸 'article' 객체의 title 프로퍼티 값을
      <h1> 태그의 텍스트로 설정합니다.
    -->
    <h1 th:text="${article.title}"></h1>
    <!--
      th:text="${article.content}"
      'article' 객체의 content 프로퍼티 값을 <p> 태그의 텍스트로 설정합니다.
    -->
    <p th:text="${article.content}"></p>

    <!--
      th:href="@{/articles/{id}/edit(id=${article.id})}"
      'Edit' 링크를 생성합니다. 클릭하면 해당 게시글의 수정 페이지('/articles/{id}/edit')로 이동합니다.
    -->
    <a th:href="@{/articles/{id}/edit(id=${article.id})}">Edit</a>

    <!--
      게시글을 삭제하기 위한 폼(form)입니다.
      th:action="@{/articles/{id}/delete(id=${article.id})}"
      폼이 제출(submit)될 때 요청을 보낼 URL을 동적으로 생성합니다.
      '/articles/{id}/delete' URL로 POST 요청을 보내게 됩니다.

      method="post"
      데이터를 서버로 보낼 때 사용하는 HTTP 메소드를 POST 방식으로 지정합니다.
      일반적으로 데이터 조회는 GET, 데이터를 생성/수정/삭제하는 중요한 작업은 POST 방식을 사용하는 것이 안전합니다.

      style="display:inline;"
      폼 태그가 줄바꿈되지 않고 링크 옆에 바로 붙어서 보이도록 하는 간단한 CSS 스타일입니다.
    -->
    <form th:action="@{/articles/{id}/delete(id=${article.id})}" method="post" style="display:inline;">
        <button type="submit">Delete</button>
    </form>
    <br>
    <!-- 목록 페이지로 돌아가는 링크입니다. -->
    <a href="/articles">Back to list</a>
</body>
</html>
