<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대화형 관심사 분석</title>
    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="window">
    <!-- 상단바 -->
    <div class="header">
        <div class="diamond"></div>
        <div class="arrow"></div>
    </div>

    <!-- 채팅 영역 -->
    <div class="chat-area" id="chatArea"></div>

    <!-- 입력창 -->
    <div class="input-area">
        <input id="userInput" placeholder="답변을 입력하세요..." />
        <button id="sendBtn">▶</button>
    </div>
</div>

<script>
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatArea = document.getElementById("chatArea");

    // 질문 리스트
    const botQuestions = [
      "1️⃣ 질문 1: 혹시 최근 주말에 가장 시간 가는 줄 모르고 집중했던 일이나, 가장 즐거웠던 활동이 있으신가요?",
      "2️⃣ 질문 2: 요즘 뉴스를 볼 때 자신도 모르게 눈길이 가거나 가장 중요하게 생각하는 분야의 소식이 있으신가요?",
      "3️⃣ 질문 3: 만약 금전적인 여유가 생긴다면, 가장 먼저 투자하거나 도전해 보고 싶은 분야는 무엇인가요?",
      "4️⃣ 질문 4: 일상에서 스트레스가 쌓이거나 피로할 때, 가장 즐겨 찾거나 몰입하는 '나만의 해소법'이 있으신가요?",
      "5️⃣ 질문 5: 혹시 최근에 새롭게 배우기 시작했거나, 지식을 쌓고 있는 분야가 있다면 무엇인가요?"
    ];

    let qIndex = 0;

    // 🧮 총합 점수 누적용 객체
    let totalScores = {
      "영화/미디어": 0,
      "스포츠": 0,
      "경제/재테크": 0,
      "기술/IT": 0,
      "일상/여행": 0
    };

    // 💬 말풍선 추가 함수
    function addMessage(text, sender = "user") {
      const div = document.createElement("div");
      div.className = sender === "user" ? "user-bubble" : "bot-bubble";
      div.innerHTML = text;
      chatArea.appendChild(div);
      scrollToBottom(50);
      return div;
    }

    // 🤖 질문 출력 함수
    function botAsk() {
      if (qIndex < botQuestions.length) {
        setTimeout(() => addMessage(botQuestions[qIndex++], "bot"), 300);
      } else {
        showFinalSummary(); // ✅ 마지막 질문 끝나면 총합 계산 호출
      }
    }

    // 📊 질문별 결과 표시
    function showResult(resultData) {

      // ✅ 하드코드된 안내 문구 (위쪽 말풍선)
      addMessage("당신의 답변을 기반으로 한 관심사 분석 결과입니다.", "bot");
      // 누적 합산
      for (let key in resultData) totalScores[key] += resultData[key];

      const chartBubble = addMessage("", "bot");
      chartBubble.innerHTML = `
        <div class="result-box">
          <canvas id="resultChart${qIndex}"></canvas>
          <ul class="rank-list">
            ${Object.entries(resultData)
              .sort((a, b) => b[1] - a[1])
              .map(([k, v], i) => `<li>${i + 1}. ${k} — ${v.toFixed(1)}%</li>`)
              .join("")}
          </ul>
        </div>
      `;

      const ctx = chartBubble.querySelector(`#resultChart${qIndex}`);

      new Chart(ctx, {
        type: "pie",
        data: {
          labels: Object.keys(resultData),
          datasets: [{
            data: Object.values(resultData),
            backgroundColor: ["#A391E3", "#C7B9FF", "#7A6EE0", "#BBAAF5", "#E5DFFF"],
            borderWidth: 2,
            borderColor: "#3E3659"
          }]
        },
        options: {
            animation: {
              duration: 1800,      // ⏱️ 애니메이션 지속시간 (기본 1000ms)
              easing: "easeOutCubic", // 🎞️ 애니메이션 가속 곡선 (아래 참고)
              animateRotate: true, // 원형 그래프 회전
              animateScale: true   // 원형 그래프 확대
            },
            plugins: { legend: { display: true, labels: { color: "#000" } } }, responsive: true }
            }
        );

      // ✅ 그래프 보여준 후 다음 질문 출력
      setTimeout(() => botAsk(), 300);
    }

    // 🧠 최종 결과 (5문항 끝나면 호출)
    function showFinalSummary() {
      const sorted = Object.entries(totalScores).sort((a, b) => b[1] - a[1]);
      const top1 = sorted[0][0];
      const top2 = sorted[1][0];

      const summaryHTML = `
        🎯 <b>최종 관심사 순위</b><br>
        1️⃣ ${sorted[0][0]}<br>
        2️⃣ ${sorted[1][0]}<br>
        3️⃣ ${sorted[2][0]}<br>
        4️⃣ ${sorted[3][0]}<br>
        5️⃣ ${sorted[4][0]}<br><br>
        ⚡ 이제 <b>${top1}</b>와 <b>${top2}</b> 중 하나를 선택해주세요.<br><br>
        <div class="choice-box">
          <button class="choice-btn" onclick="selectTopic('${top1}', this)">${top1}</button>
          <button class="choice-btn" onclick="selectTopic('${top2}', this)">${top2}</button>
        </div>
      `;

      addMessage(summaryHTML, "bot");
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: "smooth" });
    }


    // 🔗 선택 후 Spring 서버로 요청 (AI 계획 API)
function selectTopic(topic, btn) {
  const box = btn.closest(".choice-box");
  box.style.transition = "opacity 0.6s ease";
  box.style.opacity = "0";

  setTimeout(() => {
    box.remove();
    addMessage(`📅 ${topic} 주제를 선택했습니다.`, "user");

    // 🧠 AI 계획 요청
    fetch("/api/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic })
    })
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        addMessage(
          `🗓️ <b>${topic}</b>에 대한 일주일 계획입니다:<br>${data.plan}`,
          "bot"
        );
      })
      .catch(err => {
        console.error("API 연결 실패:", err);
        addMessage(
          `⚠️ 서버와 연결할 수 없습니다. (임시 계획 표시)<br>
          월: ${topic} 관련 콘텐츠 탐색<br>
          화: 관련 활동 실습 30분<br>
          수: 뉴스/자료 조사<br>
          목: 기록 및 피드백<br>
          금: 커뮤니티 참여<br>
          토: ${topic} 즐기기<br>
          일: 휴식 ☕`,
          "bot"
        );
      });
  }, 600);
}



    // 🧠 사용자가 답변 입력 시
    function handleUserInput() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      // 🌐 Flask 연동 API 호출
      fetch("/api/get-topic", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sentence: text })
      })
      // ✅ res.json() 을 return해야 다음 then에 데이터가 전달됨
      .then(res => res.json())
      .then(data => {
        if (data.scores) showResult(data.scores);
        else addMessage("❌ 분석 결과를 불러오지 못했습니다.", "bot");
      })

    .catch(() => addMessage("⚠ Flask 서버와 연결할 수 없습니다.", "bot"));
    }


    function scrollToBottom(delay = 100) {
      setTimeout(() => chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: "instant" }), delay);
    }

    sendBtn.addEventListener("click", handleUserInput);
    input.addEventListener("keypress", e => e.key === "Enter" && handleUserInput());

    // ✅ 첫 질문 자동 시작
    document.addEventListener("DOMContentLoaded", () => {
      qIndex = 0;
      botAsk();
    });
</script>
</body>
</html>
