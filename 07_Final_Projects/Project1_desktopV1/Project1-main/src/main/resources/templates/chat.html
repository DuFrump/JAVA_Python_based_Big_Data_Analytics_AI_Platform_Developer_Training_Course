<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대화형 관심사 분석</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="chat.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">대화형 관심사 분석</div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
        <input type="text" id="userInput" class="form-control" placeholder="답변을 입력하세요...">
        <button id="sendButton" class="btn btn-primary" type="button">전송</button>
    </div>
</div>

<script>
    const userInput = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const chatArea = document.getElementById("chatArea");

    const botQuestions = [
      "1️⃣ 질문 1: 혹시 최근 주말에 가장 시간 가는 줄 모르고 집중했던 일이나, 가장 즐거웠던 활동이 있으신가요?",
      "2️⃣ 질문 2: 요즘 뉴스를 볼 때 자신도 모르게 눈길이 가거나 가장 중요하게 생각하는 분야의 소식이 있으신가요?",
      "3️⃣ 질문 3: 만약 금전적인 여유가 생긴다면, 가장 먼저 투자하거나 도전해 보고 싶은 분야는 무엇인가요?",
      "4️⃣ 질문 4: 일상에서 스트레스가 쌓이거나 피로할 때, 가장 즐겨 찾거나 몰입하는 '나만의 해소법'이 있으신가요?",
      "5️⃣ 질문 5: 혹시 최근에 새롭게 배우기 시작했거나, 지식을 쌓고 있는 분야가 있다면 무엇인가요?"
    ];

    let qIndex = 0;
    let totalScores = {
      "영화/미디어": 0,
      "스포츠": 0,
      "경제/재테크": 0,
      "기술/IT": 0,
      "일상/여행": 0
    };

    function addMessage(text, sender = "user") {
        const bubble = document.createElement("div");
        bubble.className = sender === "user" ? "user-bubble" : "bot-bubble";
        bubble.innerHTML = text;
        chatArea.appendChild(bubble);
        chatArea.scrollTop = chatArea.scrollHeight;
        return bubble;
    }

    function botAsk() {
        if (qIndex < botQuestions.length) {
            setTimeout(() => addMessage(botQuestions[qIndex++], "bot"), 300);
        } else {
            showFinalSummary();
        }
    }

    function showResult(resultData) {
        addMessage("당신의 답변을 기반으로 한 관심사 분석 결과입니다.", "bot");
        for (let key in resultData) totalScores[key] += resultData[key];

        const chartId = `resultChart${qIndex}`;
        const chartBubble = addMessage(`<canvas id="${chartId}"></canvas>`, "bot");
        
        new Chart(document.getElementById(chartId), {
            type: "pie",
            data: {
                labels: Object.keys(resultData),
                datasets: [{
                    data: Object.values(resultData),
                    backgroundColor: ["#A391E3", "#C7B9FF", "#7A6EE0", "#BBAAF5", "#E5DFFF"],
                }]
            },
            options: { plugins: { legend: { display: true } } }
        });

        setTimeout(() => botAsk(), 300);
    }

    function showFinalSummary() {
        const sorted = Object.entries(totalScores).sort((a, b) => b[1] - a[1]);
        const top1 = sorted[0][0];
        const top2 = sorted[1][0];

        const summaryHTML = `
            <b>최종 관심사 순위</b><br>
            <ol>${sorted.map(item => `<li>${item[0]}</li>`).join('')}</ol>
            <p>이제 <b>${top1}</b>와 <b>${top2}</b> 중 하나를 선택해주세요.</p>
            <button class="btn btn-info choice-btn" onclick="selectTopic('${top1}')">${top1}</button>
            <button class="btn btn-info choice-btn" onclick="selectTopic('${top2}')">${top2}</button>
        `;
        addMessage(summaryHTML, "bot");
    }

    function selectTopic(topic) {
        addMessage(`${topic} 주제를 선택했습니다.`, "user");

        fetch("/api/plan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic })
        })
        .then(res => res.json())
        .then(data => {
            addMessage(`<b>${topic}</b>에 대한 일주일 계획입니다:<br>${data.plan}`, "bot");
        })
        .catch(err => {
            console.error("API Error:", err);
            addMessage("계획을 가져오는 데 실패했습니다.", "bot");
        });
    }

    function handleUserInput(event) {
        event.preventDefault(); // 브라우저의 기본 동작을 막습니다.
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, "user");
        userInput.value = "";

        fetch("/api/get-topic", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sentence: text })
        })
        .then(res => res.json())
        .then(data => {
            if (data.scores) showResult(data.scores);
            else addMessage("분석 결과를 가져오지 못했습니다.", "bot");
        })
        .catch(() => addMessage("서버와 연결할 수 없습니다.", "bot"));
    }

    sendButton.addEventListener("click", (e) => handleUserInput(e));
    userInput.addEventListener("keypress", e => {
        if (e.key === "Enter") {
            handleUserInput(e);
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        qIndex = 0;
        botAsk();
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
